name: "Docker Build Test Push"
description: "Build image, run tests and push to pkg.dev"

inputs:
  workload_identity_provider:
    description: "Full resource name of the Google Cloud Workload Identity Provider (OIDC)"
    required: false
  service_account:
    description: "Service account email to impersonate via Workload Identity Federation"
    required: false
  google_credentials:
    description: "Deprecated: Google service account JSON key. Use workload_identity_provider and service_account instead."
    required: false
    default: ""
  registry:
    description: "Image registry to use"
    required: true
    default: "us-docker.pkg.dev"
  image:
    description: "Image name (without version tag)"
    required: true
  build_args:
    description: "Build arguments to pass on to buildx"
    required: false
  run_tests:
    description: "Run the tests job using docker-compose"
    required: true
    default: "false"
  test_script:
    description: "Script to run for image testing"
    required: false
    default: |
      echo "ERROR: test_script not defined. Either define it or set run_tests to false" >&2
      exit 13
  test_build_args:
    description: "Build args for test build"
    required: false
  additional_tag:
    description: "Additional tag to apply to the image"
    required: false
    default: ""
  build_context:
    description: "Directory to use as build context"
    required: false
    default: "."

outputs:
  tags:
    description: "Image tags"
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: "Image labels"
    value: ${{ steps.meta.outputs.labels }}

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Validate authentication inputs
      shell: bash
      env:
        WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.workload_identity_provider }}
        SERVICE_ACCOUNT: ${{ inputs.service_account }}
        GOOGLE_CREDENTIALS: ${{ inputs.google_credentials }}
      run: |
        if [ -n "$WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ]; then
          exit 0
        fi
        if [ -n "$GOOGLE_CREDENTIALS" ]; then
          exit 0
        fi
        echo "ERROR: Provide either workload_identity_provider + service_account (recommended) or google_credentials (deprecated)." >&2
        exit 1

    # Setup gcloud CLI using OIDC (recommended)
    - id: "auth_oidc"
      name: "Authenticate to Google Cloud (OIDC)"
      if: ${{ inputs.workload_identity_provider != '' && inputs.service_account != '' }}
      uses: "google-github-actions/auth@v3"
      with:
        workload_identity_provider: "${{ inputs.workload_identity_provider }}"
        service_account: "${{ inputs.service_account }}"
        token_format: "access_token"

    # Setup gcloud CLI using a JSON key (deprecated fallback)
    - id: "auth_key"
      name: "Authenticate to Google Cloud (JSON key)"
      if: ${{ inputs.workload_identity_provider == '' || inputs.service_account == '' }}
      uses: "google-github-actions/auth@v3"
      with:
        credentials_json: "${{ inputs.google_credentials }}"
        token_format: "access_token"

    # Setup docker CLI
    - uses: "docker/login-action@v4"
      with:
        registry: "${{ inputs.registry }}"
        username: "oauth2accesstoken"
        password: "${{ steps.auth_oidc.outputs.access_token || steps.auth_key.outputs.access_token }}"

    # Setup buildx (used for registry-based cache)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Setup image metadata
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ inputs.registry }}/${{ inputs.image }}
        tags: |
          type=raw,value=${{ inputs.additional_tag }},enable=${{ inputs.additional_tag != '' }},priority=1500
          type=semver,pattern={{version}},priority=1300
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=sha
          type=raw,value={{date 'YYYYMMDD'}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build image locally for testing
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.build_context }}
        load: true
        build-args: ${{ inputs.test_build_args }}
        tags: ${{ inputs.registry }}/${{ inputs.image }}:test
        cache-from: type=registry,ref=${{ inputs.registry }}/${{ inputs.image }}:buildcache
        cache-to: type=registry,ref=${{ inputs.registry }}/${{ inputs.image }}:buildcache,mode=max

    - name: Test the image
      if: ${{ inputs.run_tests == 'true' }}
      run: ${{ inputs.test_script }}
      shell: bash

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.build_context }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ inputs.registry }}/${{ inputs.image }}:buildcache
        cache-to: type=registry,ref=${{ inputs.registry }}/${{ inputs.image }}:buildcache,mode=max
        build-args: |
          ${{ inputs.build_args }}
          DOCKER_METADATA_OUTPUT_VERSION
          DOCKER_METADATA_OUTPUT_TAGS
